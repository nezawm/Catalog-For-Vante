{% load static core_extras %}<!doctype html>
<html lang="{{ LANGUAGE_CODE }}" dir="{% if LANGUAGE_BIDI %}rtl{% else %}ltr{% endif %}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% t "site_title" %}{% endblock %}</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800&display=swap">
    <link rel="stylesheet" href="{% static 'Core/css/theme.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header class="site-header">
        <div class="container">
            <nav class="site-nav" aria-label="Main">
                <a href="{% url 'Core:home' %}">{% t "nav_home" %}</a>
                <a class="lang-switch" href="{% other_language_url %}">{% t "switch_language" %}</a>
            </nav>
            <a class="header-logo" href="{% url 'Core:home' %}" aria-label="Vante"><img src="{% static 'Core/img/vante-logo.svg' %}" alt="Vante"></a>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container">{% block footer %}{% t "footer" %}{% endblock %}</div>
    </footer>
</body>
</html>
