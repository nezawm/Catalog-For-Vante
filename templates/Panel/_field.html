<div class="field">
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if optional %} <span class="opt">(اختیاری)</span>{% endif %}</label>
    {{ field }}
    {% if hint %}<p class="hint">{{ hint }}</p>{% endif %}
    {% for error in field.errors %}<p class="err">{{ error }}</p>{% endfor %}
</div>
